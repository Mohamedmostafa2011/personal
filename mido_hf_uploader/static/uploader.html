<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mido · Dataset Uploader</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#0b0d12;color:#edf0f6;font:15px/1.55 system-ui,-apple-system,Segoe UI,sans-serif;padding:32px 18px}.shell{max-width:720px;margin:6vh auto}.top{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:34px}.eyebrow{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:#8992a3}.title{font-size:clamp(27px,5vw,38px);letter-spacing:-.04em;margin:6px 0}.repo{color:#aab3c3;font-size:13px}.logout{border:1px solid #343b49;background:#131821;color:#dce2ec;padding:9px 13px;border-radius:9px;cursor:pointer}.panel{border:1px solid #293140;background:#10151e;border-radius:18px;padding:clamp(18px,4vw,30px)}.drop{border:1px dashed #596579;border-radius:14px;padding:42px 18px;text-align:center;background:#131a25;transition:.15s}.drop.over{border-color:#9db4e1;background:#192438}.icon{font-size:30px}.drop h2{font-size:18px;margin:10px 0 3px}.muted{color:#929daf;font-size:13px}.choose{display:inline-block;margin-top:17px;padding:11px 17px;background:#e9edf5;color:#111722;border-radius:9px;font-weight:700;cursor:pointer}.choose input{display:none}.file{margin-top:16px;color:#c5cede;font-size:13px;overflow-wrap:anywhere}.progress-wrap{display:none;margin-top:22px}.progress-top{display:flex;justify-content:space-between;font-size:13px;color:#b8c1d0;margin-bottom:8px}.bar{height:8px;background:#272f3c;border-radius:99px;overflow:hidden}.bar>span{display:block;width:0;height:100%;background:#a9c2ef;transition:width .12s}.action{width:100%;margin-top:20px;border:0;border-radius:10px;padding:13px;background:#a9c2ef;color:#101722;font-weight:800;font-size:14px;cursor:pointer}.action:disabled{opacity:.45;cursor:not-allowed}.result{display:none;margin-top:20px;padding:16px;border:1px solid #315744;background:#102018;border-radius:12px}.result.show{display:block}.success{color:#8ee0ad;font-weight:700}.url{display:block;color:#b7caff;font-size:13px;overflow-wrap:anywhere;margin:10px 0}.copy{border:1px solid #46624f;border-radius:8px;background:#17291e;color:#d9f5e2;padding:9px 12px;cursor:pointer}.notice{margin-top:14px;min-height:20px;color:#f29a9a;font-size:13px}.foot{margin-top:18px;text-align:center;color:#727d8e;font-size:12px}
</style>
</head>
<body>
<main class="shell">
<header class="top">
  <div><div class="eyebrow">Private storage console</div><h1 class="title">Dataset uploader</h1><div class="repo">Target · MidoSTM11/Mido</div></div>
  <button class="logout" id="logout" type="button">Lock</button>
</header>
<section class="panel">
  <div class="drop" id="drop">
    <div class="icon">⇧</div><h2>Drop a file here</h2><div class="muted">or choose a file from your device</div>
    <label class="choose">Choose file<input id="file" type="file"></label>
    <div class="file" id="filename">No file selected</div>
  </div>
  <div class="progress-wrap" id="progressWrap">
    <div class="progress-top"><span id="progressLabel">Uploading…</span><span id="percent">0%</span></div>
    <div class="bar"><span id="bar"></span></div>
  </div>
  <button class="action" id="upload" type="button" disabled>Upload to Hugging Face</button>
  <div class="notice" id="notice" role="status" aria-live="polite"></div>
  <div class="result" id="result">
    <div class="success">✓ Upload complete</div>
    <div class="muted" id="uploadedName"></div>
    <a class="url" id="downloadLink" target="_blank" rel="noopener"></a>
    <button class="copy" id="copy" type="button">Copy download link</button>
  </div>
</section>
<div class="foot">Files are uploaded to your Hugging Face dataset repository.</div>
</main>
<script>
(() => {
 const input=document.getElementById('file'), drop=document.getElementById('drop'), upload=document.getElementById('upload');
 const filename=document.getElementById('filename'), notice=document.getElementById('notice');
 const progressWrap=document.getElementById('progressWrap'), bar=document.getElementById('bar'), percent=document.getElementById('percent');
 const result=document.getElementById('result');
 let selected=null;
 function choose(f){selected=f||null;filename.textContent=selected?selected.name+' · '+(selected.size/1024/1024).toFixed(2)+' MB':'No file selected';upload.disabled=!selected;notice.textContent='';result.classList.remove('show')}
 input.addEventListener('change',()=>choose(input.files[0]));
 ['dragenter','dragover'].forEach(e=>drop.addEventListener(e,ev=>{ev.preventDefault();drop.classList.add('over')}));
 ['dragleave','drop'].forEach(e=>drop.addEventListener(e,ev=>{ev.preventDefault();drop.classList.remove('over')}));
 drop.addEventListener('drop',ev=>choose(ev.dataTransfer.files[0]));
 upload.addEventListener('click',()=>{
   if(!selected)return;
   upload.disabled=true;notice.textContent='';result.classList.remove('show');progressWrap.style.display='block';
   bar.style.width='0%';percent.textContent='0%';
   const form=new FormData();form.append('file',selected);
   const xhr=new XMLHttpRequest();xhr.open('POST','/api/upload');
   xhr.upload.addEventListener('progress',ev=>{if(ev.lengthComputable){const p=Math.round(ev.loaded/ev.total*100);bar.style.width=p+'%';percent.textContent=p+'%';progressLabel.textContent='Sending file…'}});
   xhr.addEventListener('load',()=>{
     upload.disabled=false;
     let data={};try{data=JSON.parse(xhr.responseText)}catch(_){}
     if(xhr.status>=200&&xhr.status<300){
       bar.style.width='100%';percent.textContent='100%';progressLabel.textContent='Uploaded';
       document.getElementById('uploadedName').textContent=data.filename;
       const a=document.getElementById('downloadLink');a.href=data.url;a.textContent=data.url;
       result.classList.add('show');notice.textContent='';
     }else if(xhr.status===401){notice.textContent='Your session expired. Refresh and unlock again.'}
     else{notice.textContent=data.detail||'Upload failed. Please try again.'}
   });
   xhr.addEventListener('error',()=>{upload.disabled=false;notice.textContent='Network error. Check your connection.'});
   xhr.send(form);
 });
 document.getElementById('copy').addEventListener('click',async()=>{
   const url=document.getElementById('downloadLink').href;
   try{await navigator.clipboard.writeText(url);document.getElementById('copy').textContent='Copied!'}
   catch(_){document.getElementById('copy').textContent='Select and copy the link above'}
 });
 document.getElementById('logout').addEventListener('click',async()=>{
   await fetch('/api/logout',{method:'POST'});window.location.assign('/');
 });
})();
</script>
</body></html>
